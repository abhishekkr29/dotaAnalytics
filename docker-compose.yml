services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dota
      POSTGRES_PASSWORD: dota
      POSTGRES_DB: dota
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dota -d dota"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dota:dota@db:5432/dota
      DATA_DIR: /code/data
    volumes:
      - ./app:/code/app
      - ./data:/code/data
      - ./docs:/code/docs
      - ./scripts:/code/scripts
      - ./tests:/code/tests

  auth:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dota:dota@db:5432/dota
      DATA_DIR: /code/data
    volumes:
      - ./app:/code/app
      - ./data:/code/data
    ports:
      - "8502:8502"
    command: ["uvicorn", "app.auth:app", "--host", "0.0.0.0", "--port", "8502"]

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dota:dota@db:5432/dota
      DATA_DIR: /code/data
    volumes:
      - ./app:/code/app
      - ./data:/code/data
      - ./docs:/code/docs
    ports:
      - "8501:8501"
    command: [
      "streamlit", "run", "/code/app/web.py",
      "--server.port=8501",
      "--server.address=0.0.0.0",
      "--browser.gatherUsageStats=false"
    ]

volumes:
  pgdata:
